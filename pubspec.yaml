name: life_quest
description: A life gamification app where you are the RPG character.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.8.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.1

  # UI Components
  flutter_svg: ^2.0.9
  fl_chart: ^0.66.0
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  table_calendar: ^3.1.2

  # Local Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.2
  equatable: ^2.0.5
  json_annotation: ^4.8.1

  # Notifications & Alarms
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2
  android_alarm_manager_plus: ^4.0.0

  # Google Sign In
  google_sign_in: ^6.2.1

  # AI Integration (Gemini)
  google_generative_ai: ^0.2.0

  # Image Picker for food scanning
  image_picker: ^1.0.7

  # Google Calendar API
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  url_launcher: ^6.2.2
  http: ^1.1.2

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0

  # Voice/Speech Recognition
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.0

  # Health Integration (Google Fit, Apple Health, Garmin via sync)
  health: ^13.0.0

  # Device/App Info for feedback
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
